/* ---------- PromptPay EMV QR payload builder ---------- */
function crc16ccitt(str) {
  let crc = 0xffff;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
    }
  }
  return crc & 0xffff;
}
function ppTlv(tag, value) {
  return tag + String(value.length).padStart(2, "0") + value;
}
function ppSanitize(id) {
  return String(id || "").replace(/[^0-9]/g, "");
}
function ppFormatTarget(id) {
  const n = ppSanitize(id);
  if (n.length >= 13) return n;
  return ("0000000000000" + n.replace(/^0/, "66")).slice(-13);
}
function ppTargetTag(id) {
  const n = ppSanitize(id);
  if (n.length >= 15) return "03";
  if (n.length >= 13) return "02";
  return "01";
}
function buildPromptPayPayload(target, amount) {
  if (!target) return null;
  const merchantInfo = ppTlv("00", "A000000677010111") + ppTlv(ppTargetTag(target), ppFormatTarget(target));
  const parts = [
    ppTlv("00", "01"),
    ppTlv("01", amount ? "12" : "11"),
    ppTlv("29", merchantInfo),
    ppTlv("58", "TH"),
    ppTlv("53", "764"),
    amount ? ppTlv("54", Number(amount).toFixed(2)) : "",
  ];
  const body = parts.join("");
  const toCrc = body + "6304";
  const crcHex = crc16ccitt(toCrc).toString(16).toUpperCase().padStart(4, "0");
  return body + "6304" + crcHex;
}

/* ---------- cart helpers ---------- */
function getCartItems(cart, packages) {
  return packages
    .filter((p) => (cart[p.id] || 0) > 0)
    .map((p) => ({ pkg: p, qty: cart[p.id] }));
}
function cartTotal(items) {
  return items.reduce((sum, it) => sum + it.pkg.price * it.qty, 0);
}
function cartCount(items) {
  return items.reduce((sum, it) => sum + it.qty, 0);
}

function genOrderCode(n) {
  return `SC${String(n).padStart(3, "0")}`;
}

const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxA9cVPmtFM3gn4Atf9F-x2_2QXISmow5XFG6E8JXY4bZD0PZJlFBIkdg4-xWvFQOWh/exec";

async function logOrderToSheet(order) {
  if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes("วาง URL")) return;
  const packageName = order.items.map((it) => `${it.pkg.name} ×${it.qty}`).join(", ");
  const qty = order.items.reduce((sum, it) => sum + it.qty, 0);
  try {
    await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        code: order.code,
        packageName,
        qty,
        totalPrice: order.total,
        buyerName: order.form.name,
        room: order.form.room,
        phone: order.form.phone,
        status: order.status,
      }),
    });
  } catch (err) {
    console.error("Google Sheet log failed", err);
  }
}

/* Strip any base64-uploaded images before syncing (Google Sheets cells cap out around 50,000 chars).
   Image URLs (http/https) still sync fine; only locally-uploaded photos stay local to that device. */
function sanitizePackagesForSync(packages) {
  return packages.map((p) => ({
    ...p,
    image: p.image && String(p.image).startsWith("data:") ? null : p.image,
  }));
}

async function saveConfigToSheet(packages, siteText) {
  if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes("วาง URL")) return;
  try {
    await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        type: "config",
        packages: sanitizePackagesForSync(packages),
        siteText,
      }),
    });
  } catch (err) {
    console.error("Save config failed", err);
  }
}

function baht(n) {
  return `฿${Number(n || 0).toLocaleString("th-TH")}`;
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- receipt image export (canvas, no external deps) ---------- */
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function dashedLine(ctx, x1, y1, x2, y2, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}
function drawQRToCanvas(ctx, text, x, y, box) {
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const count = qr.getModuleCount();
  const cell = box / count;
  roundRectPath(ctx, x - 12, y - 12, box + 24, box + 24, 10);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.strokeStyle = C.kraftDark;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = C.ink;
  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (qr.isDark(r, c)) ctx.fillRect(x + c * cell, y + r * cell, cell + 0.6, cell + 0.6);
    }
  }
}
async function downloadOrderReceipt(order) {
  if (!order) return;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
  } catch (e) {}

  const scale = 2;
  const extraRows = Math.max(0, order.items.length - 1);
  const W = 620, H = 780 + extraRows * 34;
  const canvas = document.createElement("canvas");
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  ctx.fillStyle = C.kraft;
  ctx.fillRect(0, 0, W, H);

  const cardX = 30, cardY = 56, cardW = W - 60, cardH = H - 56 - 30;
  roundRectPath(ctx, cardX, cardY, cardW, cardH, 22);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.strokeStyle = C.kraftDark;
  ctx.lineWidth = 2;
  ctx.stroke();

  const mx = W / 2, my = cardY;
  ctx.beginPath();
  ctx.arc(mx, my, 22, 0, Math.PI * 2);
  const grad = ctx.createLinearGradient(mx - 22, my - 22, mx + 22, my + 22);
  grad.addColorStop(0, C.pink);
  grad.addColorStop(1, C.blue);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.font = "22px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("🌸", mx, my + 2);

  let y = cardY + 60;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = C.inkSoft;
  ctx.font = "600 12px 'JetBrains Mono', monospace";
  ctx.fillText("ใบยืนยันการจอง · ORDER RECEIPT", cardX + 28, y);

  y += 46;
  ctx.fillStyle = C.greenDark;
  ctx.font = "700 36px 'JetBrains Mono', monospace";
  ctx.fillText(order.code, cardX + 28, y);

  y += 26;
  dashedLine(ctx, cardX + 28, y, cardX + cardW - 28, y, C.kraftDark);
  y += 40;

  const rows = [
    ...order.items.map((it) => [`${it.pkg.name} ×${it.qty}`, baht(it.pkg.price * it.qty)]),
    ["ผู้จอง", `${order.form.name} · ${order.form.room}`],
    ["ยอดชำระรวม", baht(order.total)],
  ];
  rows.forEach(([label, value]) => {
    ctx.textAlign = "left";
    ctx.font = "13px 'Prompt', sans-serif";
    ctx.fillStyle = C.inkSoft;
    ctx.fillText(label, cardX + 28, y);
    ctx.textAlign = "right";
    ctx.font = "600 15px 'Prompt', sans-serif";
    ctx.fillStyle = C.ink;
    ctx.fillText(value, cardX + cardW - 28, y);
    y += 34;
  });

  ctx.textAlign = "left";
  ctx.font = "13px 'Prompt', sans-serif";
  ctx.fillStyle = C.inkSoft;
  ctx.fillText("สถานะ", cardX + 28, y);
  const paid = order.status === "paid";
  const badgeText = paid ? "ชำระแล้ว" : "รอชำระที่งาน";
  ctx.font = "600 13px 'Prompt', sans-serif";
  const badgeW = ctx.measureText(badgeText).width + 28;
  const badgeH = 26;
  const badgeX = cardX + cardW - 28 - badgeW;
  const badgeY = y - badgeH + 6;
  roundRectPath(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
  ctx.fillStyle = paid ? C.green : C.amber;
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.fillText(badgeText, badgeX + badgeW / 2, badgeY + badgeH / 2 + 4);

  y += 30;
  ctx.textAlign = "left";
  dashedLine(ctx, cardX + 28, y, cardX + cardW - 28, y, C.kraftDark);
  y += 36;

  const qrBox = 208;
  drawQRToCanvas(ctx, order.code, W / 2 - qrBox / 2, y, qrBox);
  y += qrBox + 42;

  ctx.textAlign = "center";
  ctx.font = "12px 'Prompt', sans-serif";
  ctx.fillStyle = C.inkSoft;
  ctx.fillText("เก็บภาพนี้ไว้ แสดงที่บูธรับดอกไม้", W / 2, y);
  ctx.fillText("ในวันงานเพื่อรับช่อดอกไม้", W / 2, y + 18);

  const link = document.createElement("a");
  link.download = `order-${order.code}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function RealQRCode({ text, size = 176 }) {
  const modules = useMemo(() => {
    if (!text) return null;
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    const count = qr.getModuleCount();
    const dark = [];
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) dark.push([r, c]);
      }
    }
    return { count, dark };
  }, [text]);

  if (!modules) return null;
  const cell = size / modules.count;

  return (
    <div className="relative mx-auto rounded-md p-3" style={{ background: "#fff", width: size + 24, boxShadow: "inset 0 0 0 1px " + C.kraftDark }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <rect width={size} height={size} fill="#fff" />
        {modules.dark.map(([r, c], i) => (
          <rect key={i} x={c * cell} y={r * cell} width={cell + 0.6} height={cell + 0.6} fill={C.ink} />
        ))}
      </svg>
    </div>
  );
}

  const [orders, setOrders] = useState([]);
  const [currentOrder, setCurrentOrder] = useState(null);
  const [secondsLeft, setSecondsLeft] = useState(300);
  const timerRef = useRef(null);

  const [packages, setPackages] = useState(DEFAULT_PACKAGES);
  const [siteText, setSiteText] = useState(DEFAULT_SITE_TEXT);
  const [configLoaded, setConfigLoaded] = useState(false);

  const [isAdmin, setIsAdmin] = useState(false);
  const [showGate, setShowGate] = useState(false);
  const [editingPackage, setEditingPackage] = useState(null);
  const [showSiteSettings, setShowSiteSettings] = useState(false);
  const [sheetOrders, setSheetOrders] = useState(null);
  const [expandedOrder, setExpandedOrder] = useState(null);
  const [sheetLoading, setSheetLoading] = useState(false);
  const [sheetError, setSheetError] = useState(null);

  function addToCart(pkgId) {
    setCart((c) => ({ ...c, [pkgId]: (c[pkgId] || 0) + 1 }));
  }
  function decFromCart(pkgId) {
    setCart((c) => {
      const next = { ...c };
      const q = (next[pkgId] || 0) - 1;
      if (q <= 0) delete next[pkgId];
      else next[pkgId] = q;
      return next;
    });
  }

  function loadSheetOrders() {
    if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes("วาง URL")) return;
    setSheetLoading(true);
    setSheetError(null);
    fetch(GOOGLE_SHEET_WEBHOOK_URL)
      .then((r) => {
        if (!r.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับผิดพลาด (HTTP ${r.status})`);
        return r.json();
      })
      .then((data) => {
        if (!Array.isArray(data)) throw new Error("ข้อมูลที่ได้ไม่ใช่รายการออเดอร์ (อาจยังไม่ได้เพิ่ม doGet หรือยังไม่ได้ Deploy เวอร์ชันใหม่)");
        setSheetOrders(data);
      })
      .catch((err) => {
        console.error("Load sheet orders failed", err);
        setSheetError(err.message || String(err));
      })
      .finally(() => setSheetLoading(false));
  }

  // Load shared packages + site text config once on startup, for every visitor.
  useEffect(() => {
    if (!GOOGLE_SHEET_WEBHOOK_URL || GOOGLE_SHEET_WEBHOOK_URL.includes("วาง URL")) {
      setConfigLoaded(true);
      return;
    }
    fetch(`${GOOGLE_SHEET_WEBHOOK_URL}?type=config`)
      .then((r) => r.json())
      .then((data) => {
        if (data && Array.isArray(data.packages) && data.packages.length > 0) setPackages(data.packages);
        if (data && data.siteText && typeof data.siteText === "object") {
          setSiteText((prev) => ({ ...prev, ...data.siteText }));
        }
      })
      .catch((err) => console.error("Load config failed", err))
      .finally(() => setConfigLoaded(true));
  }, []);

  useEffect(() => {
    if (step === "adminSummary") loadSheetOrders();
  }, [step]);

  useEffect(() => {
    if (step !== "qr") return;
    setSecondsLeft(300);
    timerRef.current = setInterval(() => setSecondsLeft((s) => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(timerRef.current);
  }, [step, currentOrder?.code]);

  const mm = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
  const ss = String(secondsLeft % 60).padStart(2, "0");

  function resetFlow() {
    setStep("home");
    setCart({});
    setForm({ name: "", room: "", phone: "" });
    setErrors({});
    setCurrentOrder(null);
  }

  function validateForm() {
    const e = {};
    if (!form.name.trim()) e.name = "กรอกชื่อ-นามสกุลผู้จอง";
    if (!form.room.trim()) e.room = "กรอกชั้น/ห้องเรียน";
    if (!/^0\d{9}$/.test(form.phone.trim())) e.phone = "กรอกเบอร์โทร 10 หลัก เช่น 0812345678";
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function finalizeOrder(status) {
    const items = getCartItems(cart, packages);
    const order = { code: genOrderCode(orders.length + 1), items, total: cartTotal(items), form: { ...form }, status, time: new Date() };
    logOrderToSheet(order);
    setOrders((o) => [order, ...o]);
    setCurrentOrder(order);
    setStep("success");
  }

  function savePackage(draft) {
    setPackages((list) => {
      let next;
      if (draft.isNew) {
        const newId = `pkg-${Date.now()}`;
        next = [...list, { ...draft, id: newId }];
      } else {
        next = list.map((p) => (p.id === draft.id ? { ...draft } : p));
      }
      saveConfigToSheet(next, siteText);
      return next;
    });
    setEditingPackage(null);
  }
  function deletePackage(id) {
    setPackages((list) => {
      const next = list.filter((p) => p.id !== id);
      saveConfigToSheet(next, siteText);
      return next;
    });
    setEditingPackage(null);
  }

  const items = getCartItems(cart, packages);
  const total = cartTotal(items);

  const displayOrders =
    sheetOrders !== null
      ? sheetOrders.map((r) => ({
          code: r.code,
          label: r.packageName,
          total: Number(r.totalPrice) || 0,
          buyerName: r.buyerName,
          room: r.room,
          phone: r.phone,
          time: r.time,
          status: r.status,
        }))
      : orders.map((o) => ({
          code: o.code,
          label: o.items.map((it) => `${it.pkg.name} ×${it.qty}`).join(", "),
          total: o.total,
          buyerName: o.form.name,
          room: o.form.room,
          phone: o.form.phone,
          time: o.time,
          status: o.status,
        }));
  const paidOrders = displayOrders.filter((o) => o.status === "paid");
  const pendingOrders = displayOrders.filter((o) => o.status === "pending");
  const paidTotal = paidOrders.reduce((sum, o) => sum + o.total, 0);
  const pendingTotal = pendingOrders.reduce((sum, o) => sum + o.total, 0);
  const grandTotal = paidTotal + pendingTotal;

  return (
    <div
      className="min-h-screen w-full flex justify-center"
      style={{
        background: `radial-gradient(circle at 12% 8%, ${C.pink}3d 0, transparent 45%), radial-gradient(circle at 92% 88%, ${C.blue}45 0, transparent 45%), ${C.kraft}`,
        fontFamily: FONT_BODY,
        color: C.ink,
      }}
    >
      <style>{`
        input:focus, textarea:focus { outline: 2px solid ${C.pink}; outline-offset: 1px; }
        @keyframes bloomIn { from { opacity:0; transform: translateY(6px) scale(0.98);} to {opacity:1; transform: translateY(0) scale(1);} }
        .bloom { animation: bloomIn 0.35s ease both; }
      `}</style>

      <div className="fixed pointer-events-none" style={{ top: -70, left: -70, width: 260, height: 260, borderRadius: "50%", background: C.pink, opacity: 0.16, filter: "blur(64px)", zIndex: 0 }} />
      <div className="fixed pointer-events-none" style={{ bottom: -100, right: -80, width: 320, height: 320, borderRadius: "50%", background: C.blue, opacity: 0.16, filter: "blur(74px)", zIndex: 0 }} />
      <div className="fixed pointer-events-none" style={{ top: "38%", right: -70, width: 190, height: 190, borderRadius: "50%", background: C.pink, opacity: 0.10, filter: "blur(58px)", zIndex: 0 }} />

      <div className="relative w-full max-w-md sm:max-w-2xl lg:max-w-5xl min-h-screen flex flex-col" style={{ zIndex: 1 }}>
        {/* header */}
        <header className="sticky top-0 z-10 px-4 pt-4 pb-3" style={{ background: `linear-gradient(180deg, ${C.kraft} 70%, transparent)` }}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              {step !== "home" && step !== "success" ? (
                <button
                  onClick={() => {
                    if (step === "info") setStep("home");
                    else if (step === "payment") setStep("info");
                    else if (step === "qr") setStep("payment");
                    else if (step === "orders") setStep("home");
                    else if (step === "adminSummary") setStep("home");
                  }}
                  className="p-1.5 rounded-full"
                  style={{ background: C.paperLight, border: `1px solid ${C.kraftDark}` }}
                  aria-label="ย้อนกลับ"
                >
                  <ArrowLeft size={16} color={C.ink} />
                </button>
              ) : (
                <Atom size={20} color={C.greenDark} />
              )}
              <div className="flex items-center gap-2.5">
                <span className="rounded-full shrink-0" style={{ width: 4, minHeight: 32, alignSelf: "stretch", background: `linear-gradient(180deg, ${C.bannerOrange}, ${C.bannerRose})` }} />
                <div>
                  <div className="text-lg leading-none font-semibold" style={{ fontFamily: FONT_DISPLAY, color: C.greenDark }}>{siteText.title}</div>
                  <div style={{ fontSize: 11, color: C.inkSoft }}>{siteText.subtitle}</div>
                </div>
              </div>
            </div>
            <div className="flex items-center gap-2">
              {step !== "orders" && (
                <button onClick={() => setStep("orders")} className="relative p-2 rounded-full" style={{ background: C.paperLight, border: `1px solid ${C.kraftDark}` }} aria-label="คำสั่งซื้อของฉัน">
                  <ClipboardList size={17} color={C.ink} />
                  {orders.length > 0 && (
                    <span className="absolute -top-1 -right-1 rounded-full flex items-center justify-center text-white font-bold" style={{ background: C.pink, width: 16, height: 16, fontSize: 9 }}>
                      {orders.length}
                    </span>
                  )}
                </button>
              )}
              <button
                onClick={() => (isAdmin ? setIsAdmin(false) : setShowGate(true))}
                className="p-2 rounded-full"
                style={{ background: isAdmin ? C.greenDark : C.paperLight, border: `1px solid ${C.kraftDark}` }}
                aria-label="โหมดแอดมิน"
              >
                {isAdmin ? <Settings size={17} color="#fff" /> : <Lock size={16} color={C.ink} />}
              </button>
            </div>
          </div>
        </header>

        <main className="flex-1 px-4 pb-24">
          {isAdmin && (
            <div className="mb-3 flex items-center justify-between px-3 py-1.5 rounded-full text-xs" style={{ background: C.greenDark, color: "#fff" }}>
              <span className="flex items-center gap-1"><Settings size={12} /> โหมดแอดมิน — แก้ไขแล้วบันทึกขึ้นชีต ทุกคนเห็นเหมือนกันหมด</span>
              <button onClick={() => setIsAdmin(false)} className="underline shrink-0 ml-2">ออก</button>
            </div>
          )}

          {isAdmin && (step === "home" || step === "adminSummary") && (
            <div className="flex gap-2 mb-3 flex-wrap">
              <button
                onClick={() => setStep(step === "adminSummary" ? "home" : "adminSummary")}
                className="text-xs px-3 py-1.5 rounded-full font-medium"
                style={{ background: C.paperLight, border: `1px solid ${C.kraftDark}` }}
              >
                {step === "adminSummary" ? "← กลับหน้าร้าน" : "สรุปยอดขาย"}
              </button>
              <button onClick={() => setShowSiteSettings(true)} className="text-xs px-3 py-1.5 rounded-full font-medium" style={{ background: C.paperLight, border: `1px solid ${C.kraftDark}` }}>
                ตั้งค่าข้อความเว็บ
              </button>
            </div>
          )}

          {step !== "home" && step !== "orders" && step !== "adminSummary" && <ProgressSteps step={step} />}

          {/* ---------------- HOME: browse & buy flowers (multi-select cart) ---------------- */}
          {step === "home" && (
            <div className="bloom">
           {siteText.announcement && (
                <div className="mb-3 px-4 py-3 rounded-lg flex items-center gap-2 font-bold text-sm" style={{ background: "#FEF2F2", color: "#B91C1C", borderLeft: "4px solid #DC2626" }}>
                  <Sparkles size={17} className="shrink-0" color="#DC2626" /> {siteText.announcement}
                </div>
              )}
              <SectionBanner icon={Flower2} className="mb-4">{siteText.homeBanner}</SectionBanner>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {packages.map((p) => {
                  const qtyInCart = cart[p.id] || 0;
                  return (
                    <div key={p.id} className="relative">
                      <div
                        className="rounded-xl overflow-hidden transition-colors"
                        style={{
                          background: C.paperLight,
                          border: `1.5px solid ${qtyInCart > 0 ? C.pink : C.kraftDark}`,
                          boxShadow: qtyInCart > 0 ? `0 10px 20px -12px ${C.pink}77` : "none",
                          opacity: p.soldOut ? 0.6 : 1,
                        }}
                      >
                        <div className="relative" style={{ height: 220, background: C.kraft }}>
                          {p.image ? (
                            <img src={p.image} alt={p.name} className="w-full h-full object-contain" style={{ filter: p.soldOut ? "grayscale(1)" : "none" }} />
                          ) : (
                            <div className="w-full h-full flex items-center justify-center gap-1">
                              {Array.from({ length: p.stems }).map((_, i) => (
                                <Flower2 key={i} size={p.stems === 1 ? 40 : 28} color={p.soldOut ? C.inkSoft : C.pink} strokeWidth={1.4} />
                              ))}
                            </div>
                          )}
                          {p.soldOut ? (
                            <span
                              className="absolute top-2 right-2 px-2.5 py-1 rounded-full font-bold text-white"
                              style={{ background: "#DC2626", fontFamily: FONT_MONO, fontSize: 12, boxShadow: "0 2px 6px rgba(0,0,0,0.25)" }}
                            >
                              SOLD OUT
                            </span>
                          ) : (
                            <span
                              className="absolute top-2 right-2 px-2.5 py-1 rounded-full font-bold"
                              style={{ background: "#fff", color: C.greenDark, fontFamily: FONT_MONO, fontSize: 13, boxShadow: "0 2px 6px rgba(0,0,0,0.18)" }}
                            >
                              {baht(p.price)}
                            </span>
                          )}
                        </div>
                        <div className="p-3.5">
                          <div className="font-semibold text-sm">{p.name}</div>
                          <div className="text-xs mt-0.5" style={{ color: C.inkSoft }}>{p.desc}</div>
                          <div className="flex items-center justify-between mt-3">
                            {p.soldOut ? (
                              <span className="text-xs font-semibold" style={{ color: "#DC2626" }}>สินค้าหมดแล้ว</span>
                            ) : qtyInCart === 0 ? (
                              <button
                                onClick={() => addToCart(p.id)}
                                className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-white"
                                style={{ background: `linear-gradient(135deg, ${C.ctaCream} 0%, ${C.ctaSage} 45%, ${C.ctaTeal} 100%)` }}
                              >
                                <Plus size={13} /> {siteText.addToCartLabel}
                              </button>
                            ) : (
                              <div className="flex items-center gap-2">
                                <button onClick={() => decFromCart(p.id)} className="w-7 h-7 rounded-full flex items-center justify-center font-bold" style={{ background: C.kraft, color: C.ink }} aria-label="ลดจำนวน">−</button>
                                <span className="w-5 text-center font-bold" style={{ fontFamily: FONT_MONO }}>{qtyInCart}</span>
                                <button
                                  onClick={() => addToCart(p.id)}
                                  className="w-7 h-7 rounded-full flex items-center justify-center font-bold text-white"
                                  style={{ background: `linear-gradient(135deg, ${C.ctaCream} 0%, ${C.ctaSage} 45%, ${C.ctaTeal} 100%)` }}
                                  aria-label="เพิ่มจำนวน"
                                >
                                  +
                                </button>
                              </div>
                            )}
                            {qtyInCart > 0 && !p.soldOut && (
                              <span className="font-bold text-sm" style={{ fontFamily: FONT_MONO, color: C.greenDark }}>{baht(p.price * qtyInCart)}</span>
                            )}
                          </div>
                        </div>
                      </div>
                      {isAdmin && (
                        <button
                          onClick={() => setEditingPackage(p)}
                          className="absolute top-2 left-2 p-1.5 rounded-full z-10"
                          style={{ background: C.ink, boxShadow: "0 1px 4px rgba(0,0,0,0.3)" }}
                          aria-label="แก้ไขแพ็กเกจ"
                        >
                          <Pencil size={12} color="#fff" />
                        </button>
                      )}
                    </div>
                  );
                })}
                {isAdmin && (
                  <button
                   onClick={() => setEditingPackage({ isNew: true, id: null, name: "", stems: 3, price: 0, desc: "", image: null, soldOut: false })}
                    className="rounded-xl flex flex-col items-center justify-center gap-1 py-8"
                    style={{ border: `1.5px dashed ${C.kraftDark}`, color: C.inkSoft }}
                  >
                    <Plus size={20} />
                    <span className="text-xs">เพิ่มแพ็กเกจดอกไม้</span>
                  </button>
                )}
              </div>

              {items.length > 0 && (
                <div className="mt-4 rounded-lg p-4 bloom" style={{ background: C.paperLight, border: `1.5px solid ${C.pink}` }}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-sm font-medium">ตะกร้า · {cartCount(items)} ช่อ ({items.length} แบบ)</span>
                    <span className="font-bold" style={{ fontFamily: FONT_MONO, color: C.greenDark }}>{baht(total)}</span>
                  </div>
                  <button
                    onClick={() => setStep("info")}
                    className="w-full mt-3 py-3 rounded-lg font-semibold text-white"
                    style={{ background: `linear-gradient(135deg, ${C.ctaCream} 0%, ${C.ctaSage} 45%, ${C.ctaTeal} 100%)` }}
                  >
                    {siteText.cartCheckoutButton}
                  </button>
                </div>
              )}
            </div>
          )}

          {/* ---------------- ADMIN: sales summary ---------------- */}
          {step === "adminSummary" && (
            <div className="bloom">
              <div className="flex items-center justify-between mb-4 gap-2">
                <SectionBanner icon={Wallet}>สรุปยอดขายทั้งหมด</SectionBanner>
                <button
                  onClick={loadSheetOrders}
                  className="shrink-0 p-2 rounded-full"
                  style={{ background: C.paperLight, border: `1px solid ${C.kraftDark}` }}
                  aria-label="รีเฟรชข้อมูล"
                >
                  <RefreshCcw size={15} color={C.ink} />
                </button>
              </div>

              <div
                className="mb-3 text-xs px-3 py-2 rounded-md"
                style={{
                  background: sheetError ? "#DC262622" : sheetOrders !== null ? C.ctaSage + "33" : C.amber + "22",
                  color: sheetError ? "#DC2626" : sheetOrders !== null ? C.ctaTeal : C.amber,
                }}
              >
                {sheetLoading
                  ? "กำลังโหลดข้อมูลจาก Google Sheet..."
                  : sheetError
                  ? `โหลดจากชีตไม่สำเร็จ: ${sheetError}`
                  : sheetOrders !== null
                  ? `ข้อมูลจาก Google Sheet · อัปเดตล่าสุดตอนนี้ (${sheetOrders.length} รายการ)`
                  : "ยังไม่ได้เชื่อม Google Sheet — แสดงเฉพาะออเดอร์ในเครื่องนี้เท่านั้น"}
              </div>

              <div className="grid grid-cols-2 gap-3 mb-3">
                <div className="rounded-lg p-3" style={{ background: C.paperLight, border: `1.5px solid ${C.kraftDark}` }}>
                  <div className="flex items-center gap-1.5 mb-1">
                    <QrCode size={14} color={C.greenDark} />
                    <span className="text-xs font-medium" style={{ color: C.inkSoft }}>ยอดโอน (QR)</span>
                  </div>
                  <div className="font-bold text-lg" style={{ fontFamily: FONT_MONO, color: C.ink }}>{baht(paidTotal)}</div>
                  <div style={{ fontSize: 11, color: C.inkSoft }}>{paidOrders.length} ออเดอร์</div>
                </div>
                <div className="rounded-lg p-3" style={{ background: C.paperLight, border: `1.5px solid ${C.kraftDark}` }}>
                  <div className="flex items-center gap-1.5 mb-1">
                    <Wallet size={14} color={C.amber} />
                    <span className="text-xs font-medium" style={{ color: C.inkSoft }}>ยอดชำระปลายทาง</span>
                  </div>
                  <div className="font-bold text-lg" style={{ fontFamily: FONT_MONO, color: C.ink }}>{baht(pendingTotal)}</div>
                  <div style={{ fontSize: 11, color: C.inkSoft }}>{pendingOrders.length} ออเดอร์</div>
                </div>
              </div>

              <div className="rounded-lg p-4 mb-4 text-center text-white" style={{ background: `linear-gradient(135deg, ${C.purple}, ${C.pink})` }}>
                <div className="text-xs opacity-90">ยอดขายรวมทั้งหมด</div>
                <div className="text-2xl font-bold" style={{ fontFamily: FONT_MONO }}>{baht(grandTotal)}</div>
                <div className="text-xs opacity-90 mt-1">{displayOrders.length} ออเดอร์ทั้งหมด</div>
              </div>

              <div className="text-xs font-medium mb-2" style={{ color: C.inkSoft }}>รายการทั้งหมด</div>
              {displayOrders.length === 0 ? (
                <div className="rounded-lg p-6 text-center text-sm" style={{ background: C.paperLight, border: `1.5px dashed ${C.kraftDark}`, color: C.inkSoft }}>
                  ยังไม่มีคำสั่งซื้อ
                </div>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-2">
                  {displayOrders.map((o) => {
                    const isOpen = expandedOrder === o.code;
                    return (
                      <div key={o.code} className="rounded-lg overflow-hidden" style={{ background: C.paperLight, border: `1px solid ${C.kraftDark}` }}>
                        <button
                          onClick={() => setExpandedOrder(isOpen ? null : o.code)}
                          className="w-full p-3 flex items-center justify-between text-left"
                        >
                          <div className="min-w-0">
                            <div className="font-bold" style={{ fontFamily: FONT_MONO, color: C.greenDark, fontSize: 12 }}>{o.code}</div>
                            <div className="truncate" style={{ fontSize: 11, color: C.inkSoft }}>{o.label} · {o.buyerName}</div>
                          </div>
                          <div className="flex items-center gap-2 shrink-0 ml-2">
                            <div className="text-right">
                              <div className="font-bold text-sm" style={{ fontFamily: FONT_MONO }}>{baht(o.total)}</div>
                              <StatusBadge status={o.status} />
                            </div>
                            <ChevronRight size={14} color={C.inkSoft} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s" }} />
                          </div>
                        </button>
                        {isOpen && (
                          <div className="px-3 pb-3 pt-1" style={{ borderTop: `1px dashed ${C.kraftDark}` }}>
                            <Row label="ชื่อผู้จอง" value={o.buyerName || "-"} />
                            <Row label="ห้อง/ชั้น" value={o.room || "-"} />
                            <Row label="เบอร์โทร" value={o.phone || "-"} />
                            <Row label="เวลา" value={o.time ? new Date(o.time).toLocaleString("th-TH") : "-"} />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* ---------------- INFO FORM ---------------- */}
          {step === "info" && items.length > 0 && (
            <div className="bloom">
              <CartSummary items={items} total={total} />
              <SectionBanner icon={ClipboardList} className="mt-4 mb-4">{siteText.infoBanner}</SectionBanner>
              <div className="flex flex-col gap-3">
                <Field label={siteText.nameLabel} value={form.name} error={errors.name} onChange={(v) => setForm((f) => ({ ...f, name: v }))} placeholder={siteText.namePlaceholder} />
                <Field label={siteText.roomLabel} value={form.room} error={errors.room} onChange={(v) => setForm((f) => ({ ...f, room: v }))} placeholder={siteText.roomPlaceholder} />
                <Field label={siteText.phoneLabel} value={form.phone} error={errors.phone} onChange={(v) => setForm((f) => ({ ...f, phone: v.replace(/[^\d]/g, "") }))} placeholder={siteText.phonePlaceholder} inputMode="numeric" />
              </div>
              <button onClick={() => validateForm() && setStep("payment")} className="w-full mt-5 py-3 rounded-lg font-semibold text-white" style={{ background: `linear-gradient(135deg, ${C.ctaCream} 0%, ${C.ctaSage} 45%, ${C.ctaTeal} 100%)` }}>
                {siteText.infoContinueButton}
              </button>
            </div>
          )}

          {/* ---------------- PAYMENT CHOICE ---------------- */}
          {step === "payment" && items.length > 0 && (
            <div className="bloom">
              <CartSummary items={items} total={total} form={form} />
              <SectionBanner icon={Wallet} className="mt-4 mb-4">{siteText.paymentBanner}</SectionBanner>
              <div className="flex flex-col gap-3">
                <button onClick={() => setStep("qr")} className="rounded-lg p-4 flex items-center gap-3 text-left" style={{ background: C.paperLight, border: `1.5px solid ${C.blue}` }}>
                  <div className="p-2 rounded-md" style={{ background: C.blue + "22" }}><QrCode size={20} color={C.blue} /></div>
                  <div className="flex-1">
                    <div className="font-semibold text-sm">{siteText.qrOptionTitle}</div>
                    <div className="text-xs" style={{ color: C.inkSoft }}>{siteText.qrOptionDesc}</div>
                  </div>
                  <ChevronRight size={16} color={C.inkSoft} />
                </button>
                <button onClick={() => finalizeOrder("pending")} className="rounded-lg p-4 flex items-center gap-3 text-left" style={{ background: C.paperLight, border: `1.5px solid ${C.amber}` }}>
                  <div className="p-2 rounded-md" style={{ background: C.amber + "22" }}><Wallet size={20} color={C.amber} /></div>
                  <div className="flex-1">
                    <div className="font-semibold text-sm">{siteText.codOptionTitle}</div>
                    <div className="text-xs" style={{ color: C.inkSoft }}>{siteText.codOptionDesc}</div>
                  </div>
                  <ChevronRight size={16} color={C.inkSoft} />
                </button>
              </div>
              <div className="mt-4 text-xs px-3 py-2 rounded-md flex items-center gap-2" style={{ background: C.paperLight, color: C.inkSoft }}>
                <Sparkles size={13} /> ยอดรวม: <span style={{ fontFamily: FONT_MONO, color: C.ink }}>{baht(total)}</span>
              </div>
            </div>
          )}

          {/* ---------------- QR SCREEN ---------------- */}
          {step === "qr" && items.length > 0 && (
            <div className="bloom text-center">
              <Eyebrow color={C.blue}>{siteText.qrEyebrow}</Eyebrow>
              <div className="text-2xl font-bold mb-3" style={{ fontFamily: FONT_MONO, color: C.ink }}>{baht(total)}</div>
              {siteText.promptpayId ? (
                <>
                  <RealQRCode text={buildPromptPayPayload(siteText.promptpayId, total)} size={200} />
                  {siteText.promptpayName && (
                    <div className="mt-2 text-xs" style={{ color: C.inkSoft }}>
                      ชื่อบัญชี: <span style={{ color: C.ink, fontWeight: 600 }}>{siteText.promptpayName}</span>
                    </div>
                  )}
                </>
              ) : (
                <div className="my-3 text-xs px-3 py-3 rounded-md text-left" style={{ background: C.amber + "22", color: C.amber, border: `1px solid ${C.amber}55` }}>
                  {siteText.qrNoPromptpayWarning}
                </div>
              )}
              <div className="mt-3 inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full" style={{ background: secondsLeft === 0 ? "#E8759F22" : C.paperLight, color: secondsLeft === 0 ? C.pink : C.inkSoft }}>
                <Timer size={13} /> {secondsLeft === 0 ? siteText.qrExpiredLabel : `${siteText.qrTimeLeftPrefix} ${mm}:${ss}`}
              </div>
              {secondsLeft === 0 ? (
                <button onClick={() => setSecondsLeft(300)} className="w-full mt-5 py-3 rounded-lg font-semibold flex items-center justify-center gap-2" style={{ background: C.paperLight, border: `1.5px solid ${C.kraftDark}`, color: C.ink }}>
                  <RefreshCcw size={16} /> {siteText.qrRefreshButton}
                </button>
              ) : (
                <button onClick={() => finalizeOrder("paid")} className="w-full mt-5 py-3 rounded-lg font-semibold text-white" style={{ background: `linear-gradient(135deg, ${C.blue}, ${C.greenDark})` }}>
                  {siteText.qrPaidButton}
                </button>
              )}
              <button onClick={() => setStep("payment")} className="w-full mt-2 py-2.5 rounded-lg text-sm" style={{ color: C.inkSoft }}>
                {siteText.qrSwitchToCodButton}
              </button>
            </div>
          )}

          {/* ---------------- SUCCESS ---------------- */}
          {step === "success" && currentOrder && (
            <div className="bloom">
              <div className="text-center mb-4">
                <CheckCircle2 size={34} color={C.greenDark} className="mx-auto mb-1" />
                <div className="text-base font-semibold">{siteText.successTitle}</div>
              </div>
              <PinnedCard>
                <Eyebrow>{siteText.receiptEyebrow}</Eyebrow>
                <div className="text-3xl font-bold tracking-wider mb-3" style={{ fontFamily: FONT_MONO, color: C.greenDark }}>{currentOrder.code}</div>
                <div style={{ borderTop: `1.5px dashed ${C.kraftDark}` }} className="mb-3" />
                {currentOrder.items.map((it) => (
                  <Row key={it.pkg.id} label={`${it.pkg.name} ×${it.qty}`} value={baht(it.pkg.price * it.qty)} />
                ))}
                <Row label="ผู้จอง" value={`${currentOrder.form.name} · ${currentOrder.form.room}`} />
                <Row label="ยอดชำระรวม" value={baht(currentOrder.total)} />
                <div className="flex items-center justify-between py-1.5">
                  <span className="text-xs" style={{ color: C.inkSoft }}>สถานะ</span>
                  <StatusBadge status={currentOrder.status} />
                </div>
                <div style={{ borderTop: `1.5px dashed ${C.kraftDark}` }} className="my-3" />
                <p
                  className="text-center mt-3"
                  style={
                    currentOrder.status === "paid"
                      ? { color: "#DC2626", fontSize: 13, fontWeight: 700 }
                      : { color: C.inkSoft, fontSize: 11 }
                  }
                >
                  {currentOrder.status === "paid" ? siteText.pickupInstructionPaid : siteText.pickupInstructionPending}
                </p>
              </PinnedCard>
              <button
                onClick={() => downloadOrderReceipt(currentOrder)}
                className="w-full mt-5 py-3 rounded-lg font-semibold text-white flex items-center justify-center gap-2"
                style={{ background: `linear-gradient(135deg, ${C.ctaCream} 0%, ${C.ctaSage} 45%, ${C.ctaTeal} 100%)` }}
              >
                <Download size={16} /> {siteText.saveImageButton}
              </button>
              <button onClick={resetFlow} className="w-full mt-2 py-2.5 rounded-lg text-sm font-medium" style={{ color: C.ink, border: `1.5px solid ${C.kraftDark}` }}>{siteText.bookAnotherButton}</button>
              <button onClick={() => setStep("orders")} className="w-full mt-2 py-2.5 rounded-lg text-sm font-medium" style={{ color: C.ink, border: `1.5px solid ${C.kraftDark}` }}>{siteText.viewOrdersButton}</button>
            </div>
          )}

          {/* ---------------- ORDERS LIST ---------------- */}
          {step === "orders" && (
            <div className="bloom">
              <SectionBanner icon={ClipboardList} className="mb-4">{siteText.ordersBanner}</SectionBanner>
              {orders.length === 0 ? (
                <div className="rounded-lg p-6 text-center text-sm" style={{ background: C.paperLight, border: `1.5px dashed ${C.kraftDark}`, color: C.inkSoft }}>
                  {siteText.ordersEmptyText}
                  <button onClick={() => setStep("home")} className="block mx-auto mt-3 px-4 py-2 rounded-lg text-white text-sm font-medium" style={{ background: `linear-gradient(135deg, ${C.ctaCream} 0%, ${C.ctaSage} 45%, ${C.ctaTeal} 100%)` }}>{siteText.ordersEmptyButton}</button>
                </div>
              ) : (
                <div className="flex flex-col gap-3">
                  {orders.map((o) => (
                    <div key={o.code} className="rounded-lg p-3.5" style={{ background: C.paperLight, border: `1.5px solid ${C.kraftDark}` }}>
                      <div className="flex items-center justify-between mb-1.5">
                        <span className="font-bold text-sm tracking-wide" style={{ fontFamily: FONT_MONO, color: C.greenDark }}>{o.code}</span>
                        <div className="flex items-center gap-2">
                          <StatusBadge status={o.status} />
                          <button onClick={() => downloadOrderReceipt(o)} className="p-1.5 rounded-full" style={{ background: C.kraft }} aria-label="บันทึกภาพออเดอร์">
                            <Download size={13} color={C.ink} />
                          </button>
                        </div>
                      </div>
                      <div className="text-xs" style={{ color: C.inkSoft }}>{o.items.map((it) => `${it.pkg.name} ×${it.qty}`).join(", ")} · {baht(o.total)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </main>
      </div>

      {showGate && <AdminGateModal onClose={() => setShowGate(false)} onSuccess={() => { setIsAdmin(true); setShowGate(false); }} />}
      {editingPackage && (
        <PackageEditSheet initial={editingPackage} onCancel={() => setEditingPackage(null)} onSave={savePackage} onDelete={deletePackage} />
      )}
      {showSiteSettings && (
        <SiteSettingsSheet
          initial={siteText}
          onCancel={() => setShowSiteSettings(false)}
          onSave={(d) => {
            setSiteText(d);
            saveConfigToSheet(packages, d);
            setShowSiteSettings(false);
          }}
        />
      )}
    </div>
  );
}

/* ---------- sub-components used above ---------- */

function CartSummary({ items, total, form }) {
  return (
    <div className="rounded-lg p-3 text-xs" style={{ background: C.paperLight, border: `1px solid ${C.kraftDark}`, color: C.inkSoft }}>
      {items.map(({ pkg, qty }) => (
        <div key={pkg.id} className="flex items-center gap-3 py-1">
          <span className="w-8 h-8 rounded-md flex items-center justify-center shrink-0 overflow-hidden" style={{ background: C.kraft }}>
            {pkg.image ? <img src={pkg.image} alt="" className="w-full h-full object-cover" /> : <Flower2 size={15} color={C.pink} />}
          </span>
          <div className="flex-1 min-w-0 truncate font-medium" style={{ color: C.ink }}>{pkg.name} ×{qty}</div>
          <div style={{ color: C.ink }}>{baht(pkg.price * qty)}</div>
        </div>
      ))}
      <div className="flex items-center justify-between pt-2 mt-1" style={{ borderTop: `1px dashed ${C.kraftDark}` }}>
        <span className="font-medium" style={{ color: C.ink }}>ยอดรวม</span>
        <span className="font-bold" style={{ fontFamily: FONT_MONO, color: C.greenDark }}>{baht(total)}</span>
      </div>
      {form?.name && <div className="mt-1 truncate">ผู้จอง: {form.name}</div>}
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div className="flex items-start justify-between gap-3 py-1">
      <span className="text-xs shrink-0" style={{ color: C.inkSoft }}>{label}</span>
      <span className="text-xs font-medium text-right">{value}</span>
    </div>
  );
}

function Field({ label, value, onChange, error, placeholder, inputMode }) {
  return (
    <label className="block">
      <span className="text-xs font-medium" style={{ color: C.inkSoft }}>{label}</span>
      <input
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        inputMode={inputMode}
        className="w-full mt-1 px-3 py-2.5 rounded-lg text-sm"
        style={{ background: C.paperLight, border: `1.5px solid ${error ? C.pink : C.kraftDark}`, color: C.ink }}
      />
      {error && <span className="mt-1 block" style={{ color: C.pink, fontSize: 11 }}>{error}</span>}
    </label>
  );
}

/* ---------- mount ---------- */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FlowerBookingPreview />);
</script>
</body>
</html>
